<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniMemory</title>
  <link rel="stylesheet" href="src/styles/popup.css">
</head>
<body>
  <div id="app">
    <!-- Loading State -->
    <div id="loading" class="state">
      <div class="spinner"></div>
    </div>
    
    <!-- Not Authenticated -->
    <div id="not-authenticated" class="state hidden">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1>UniMemory</h1>
      <p>Capture AI chats and build your personal memory layer</p>
      <button id="login-btn" class="btn btn-primary">
        Log in to UniMemory
      </button>
    </div>
    
    <!-- Authenticated -->
    <div id="authenticated" class="state hidden">
      <div class="header">
        <div class="user-info">
          <div class="avatar" id="user-avatar"></div>
          <div class="user-details">
            <span class="user-name" id="user-name"></span>
            <span class="user-email" id="user-email"></span>
          </div>
        </div>
        <button id="logout-btn" class="btn-icon" title="Logout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
            <polyline points="16,17 21,12 16,7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
      
      <div class="section">
        <h2>Capture Settings</h2>
        
        <div class="toggle-row">
          <div class="toggle-info">
            <span class="toggle-label">Auto-save chats</span>
            <span class="toggle-desc">Automatically save when you leave a chat</span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="auto-save-toggle">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
      
      <div class="section">
        <h2>Platforms</h2>
        
        <div class="platform-list">
          <div class="platform-item">
            <div class="platform-icon chatgpt">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.8956zm16.0993 3.8558L12.6 8.3829l2.02-1.1638a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6026-1.4997z"/>
              </svg>
            </div>
            <span class="platform-name">ChatGPT</span>
            <label class="toggle small">
              <input type="checkbox" id="platform-chatgpt" checked>
              <span class="toggle-slider"></span>
            </label>
          </div>
          
          <div class="platform-item">
            <div class="platform-icon claude">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
              </svg>
            </div>
            <span class="platform-name">Claude</span>
            <label class="toggle small">
              <input type="checkbox" id="platform-claude" checked>
              <span class="toggle-slider"></span>
            </label>
          </div>
          
          <div class="platform-item">
            <div class="platform-icon gemini">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
              </svg>
            </div>
            <span class="platform-name">Gemini</span>
            <label class="toggle small">
              <input type="checkbox" id="platform-gemini" checked>
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
      </div>
      
      <div class="footer">
        <a href="https://app.unimemory.app/memories" target="_blank" class="btn btn-secondary">
          View Memories
        </a>
      </div>
    </div>
  </div>
  
  <script src="src/popup/index.js"></script>
</body>
</html>
