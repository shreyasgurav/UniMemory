<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniMemory</title>
  <link rel="stylesheet" href="src/styles/popup.css">
</head>
<body>
  <div id="app">
    <!-- Loading State -->
    <div id="loading" class="state">
      <div class="spinner"></div>
    </div>
    
    <!-- Not Authenticated -->
    <div id="not-authenticated" class="state hidden">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1>UniMemory</h1>
      <p>Save any AI chat to your personal memory layer</p>
      <button id="login-btn" class="btn btn-primary">
        Log in to UniMemory
      </button>
    </div>
    
    <!-- Authenticated -->
    <div id="authenticated" class="state hidden">
      <!-- Header with logo -->
      <div class="header">
        <div class="logo-header">
          <img src="/Unimemory Name Logo NoBG.png" alt="UniMemory" class="logo-image" />
        </div>
      </div>
      
      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" data-tab="save">Save</button>
        <button class="tab" data-tab="imports">Imports</button>
        <button class="tab" data-tab="settings">Settings</button>
      </div>
      
      <!-- Save Tab -->
      <div id="tab-save" class="tab-content active">
        <div class="page-info">
          <h3 id="page-title">Current Page</h3>
          <p id="page-url">https://...</p>
        </div>
        
        <div class="setting-item">
          <div class="setting-info">
            <span class="setting-label">Auto-save chats</span>
            <span class="setting-desc">Automatically save when you leave a page</span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="auto-save-toggle">
            <span class="toggle-slider"></span>
          </label>
        </div>
        
        <div class="status-message hidden" id="status-message"></div>
        
        <div class="save-button-container">
          <button id="save-current-page-btn" class="btn btn-primary">
            Save
          </button>
        </div>
      </div>
      
      <!-- Imports Tab -->
      <div id="tab-imports" class="tab-content hidden">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
            <polyline points="7,10 12,15 17,10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <p>Import history coming soon</p>
        </div>
      </div>
      
      <!-- Settings Tab -->
      <div id="tab-settings" class="tab-content hidden">
        <div class="settings-section">
          <h4>Account</h4>
          <div class="user-info-settings">
            <div class="avatar-small" id="user-avatar-settings"></div>
            <div class="user-details-settings">
              <span class="user-name-settings" id="user-name-settings"></span>
              <span class="user-email-settings" id="user-email-settings"></span>
            </div>
          </div>
          <div class="settings-buttons">
            <a href="https://app.unimemory.app" target="_blank" class="btn btn-secondary btn-small">
              Open Dashboard
            </a>
            <button id="logout-btn" class="btn btn-danger btn-small">
              Log out
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="src/popup/index.js"></script>
</body>
</html>
