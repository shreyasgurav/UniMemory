<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniMemory</title>
  <link rel="stylesheet" href="src/styles/popup.css">
</head>
<body>
  <div id="app">
    <!-- Loading State -->
    <div id="loading" class="state">
      <div class="spinner"></div>
    </div>
    
    <!-- Not Authenticated -->
    <div id="not-authenticated" class="state hidden">
      <div class="login-container">
        <div class="login-logo">
          <img src="/Unimemory Name Logo NoBG.png" alt="UniMemory" class="logo-image-login" />
        </div>
        <p class="login-subtitle">Unified Memory for all your AI applications.</p>
        <div class="login-separator"></div>
        <button id="login-btn" class="btn btn-primary btn-login">
          Log in to UniMemory
        </button>
      </div>
    </div>
    
    <!-- Authenticated -->
    <div id="authenticated" class="state hidden">
      <!-- Header with logo -->
      <div class="header">
        <div class="logo-header">
          <img src="/Unimemory Name Logo NoBG.png" alt="UniMemory" class="logo-image" />
        </div>
      </div>
      
      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" data-tab="save">Save</button>
        <button class="tab" data-tab="settings">Settings</button>
      </div>
      
      <!-- Save Tab -->
      <div id="tab-save" class="tab-content active">
        <div class="page-info">
          <h3 id="page-title">Current Page</h3>
          <p id="page-url">https://...</p>
        </div>
        
        <!-- Project Selector -->
        <div class="project-selector">
          <label class="project-label">Save to project:</label>
          <div class="project-dropdown-container">
            <button id="project-dropdown-btn" class="project-dropdown-btn">
              <span id="selected-project-icon">⭐</span>
              <span id="selected-project-name">Default</span>
              <svg class="dropdown-arrow" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </button>
            <div id="project-dropdown-menu" class="project-dropdown-menu hidden">
              <div id="project-list"></div>
              <div class="project-dropdown-divider"></div>
              <button id="new-project-btn" class="project-dropdown-item new-project">
                <span class="project-icon">+</span>
                <span>New Project...</span>
              </button>
            </div>
          </div>
        </div>
        
        <div class="status-message hidden" id="status-message"></div>
        
        <div class="save-button-container">
          <button id="save-current-page-btn" class="btn btn-primary btn-save-large">
            <svg id="save-btn-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <!-- Document icon (default) -->
              <path id="icon-document" d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
              <polyline id="icon-document-fold" points="14 2 14 8 20 8"/>
              <!-- Chat icon (hidden by default) -->
              <path id="icon-chat" class="hidden" d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            <span id="save-btn-text">Save Current Page</span>
          </button>
        </div>
      </div>
      
      <!-- Settings Tab -->
      <div id="tab-settings" class="tab-content hidden">
        <div class="settings-section">
          <h4>Account</h4>
          <div class="user-info-settings">
            <div class="avatar-small" id="user-avatar-settings"></div>
            <div class="user-details-settings">
              <span class="user-name-settings" id="user-name-settings"></span>
              <span class="user-email-settings" id="user-email-settings"></span>
            </div>
          </div>
          
          <div class="setting-item setting-item-toggle">
            <div class="setting-info">
              <span class="setting-label">Save long-term memories</span>
              <span class="setting-desc">Auto-save memories from your AI conversations</span>
            </div>
            <label class="toggle">
              <input type="checkbox" id="auto-save-toggle">
              <span class="toggle-slider"></span>
            </label>
          </div>
          
          <div class="settings-buttons">
            <a href="https://app.unimemory.app" target="_blank" class="btn btn-secondary btn-small">
              Open Dashboard
            </a>
            <button id="logout-btn" class="btn btn-logout">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
              Log out
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="src/popup/index.js"></script>
</body>
</html>
